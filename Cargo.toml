[package]
name = "http_server_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time"] }

# Redis Client 
fred = { version = "10.1.0", features = ["serde-json", "enable-rustls", "i-scripts"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"

# Configuration & Env
config = "0.15"
dotenvy = "0.15"

# Middleware & Tower
tower = "0.5"
tower_governor = "0.8.0"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time", "chrono"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1.24", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
governor = "0.10.4"
thiserror = "2.0.19"
anyhow = "1.0.104"
mongodb = "3.8.0"
async-trait = "0.1.91"
aes-gcm = "0.10.3"
argon2 = { version = "0.5.3", features = ["std"] }
rand = "0.10"
base64 = "0.22.1"
serde_bytes = "0.11.19"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
