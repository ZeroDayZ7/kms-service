# config/settings.toml

[server]
host = "127.0.0.1"
port = 7000
shutdown_timeout = 30

[log]
level = "debug"

[cors]
allowed_methods = ["GET", "POST", "OPTIONS", "PATCH"]
max_age = 3600

[cors.allowed_origin]
type = "List"
value = [
  "http://localhost:3000",
  "https://myapp.com",
  "https://admin.myapp.com"
]

[database]
host = "127.0.0.1"
port = 27017
name = "kms_db"
pool_size = 5
auth_source = "admin"

[redis]
host = "127.0.0.1"
port = 6379
db = 0

[rate_limit]
global_per_second = 50
global_burst = 100
health_per_second = 50
health_burst = 100
auth_per_second = 50
auth_burst = 100

[crypto]
# Master Key w Base64
master_key_b64 = "dWRGdk1pZ0lqNmIzeXo4bEF1SEpvaU5qTndqRWxYOWU="
default_key_ttl_days = 365